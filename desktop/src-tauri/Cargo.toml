[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort_types = { path = "../../ort_types", features = ["specta"] }
specta = { workspace = true }
# TypeScript codegen lives here, not in ort_types: it is a host-side build
# concern, and ort_types has to stay buildable for thumbv7em.
specta-typescript = { workspace = true }

# The release optimizations that used to live here now sit in the workspace
# root as [profile.dist] — Cargo ignores [profile.*] outside the root manifest.
