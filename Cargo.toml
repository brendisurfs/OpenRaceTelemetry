[workspace]
members = ["ort_types", "desktop/src-tauri"]
exclude = ["firmware"]
# The firmware has its own workspace (firmware/Cargo.toml) so rust-analyzer
# can analyze it for thumbv7em while this workspace runs on the host. A bare
# `cargo build` here covers only the shared crate.
default-members = ["ort_types"]
resolver = "3"


[workspace.dependencies]
# Also used by the firmware workspace, which pins the same version. Keep the
# two in sync: `ort_types` derives `defmt::Format` against the defmt it is
# built with.
defmt = "1.1.1"


# `default-features = false` keeps serde no_std-compatible; the desktop crate
# turns `std` back on via its own dependency on serde.
serde = { version = "1", default-features = false, features = ["derive"] }

# specta-typescript 0.0.12 pins `specta =2.0.0-rc.25`, so the two have to move
# together — mixing in specta 1.x silently compiles both and the `Type` derive
# from one line won't satisfy the exporter from the other.
# `std` carries the `Type` impl for `String` (mapped to `str`), which the DTOs
# need. Only the desktop crate depends on specta, so the firmware pays nothing.
specta = { version = "=2.0.0-rc.25", features = ["derive", "std"] }
specta-typescript = "0.0.12"

# Desktop bundles are built with `--profile dist` (see desktop/tauri.conf.json).
# Cargo only honours [profile.*] in the workspace root, so these settings —
# formerly in desktop/src-tauri/Cargo.toml — have to live here.
[profile.dist]
inherits = "release"
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
debug = 0
